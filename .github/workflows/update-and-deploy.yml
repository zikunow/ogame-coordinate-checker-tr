name: Update API snapshots and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code and parser
        run: |
          python scripts/build_locales.py
          npm run check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Download official TR API snapshots
        run: python scripts/update_data.py
      - name: Verify snapshots and matching rules
        run: npm test
      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data site/ru.html site/app.ru.js site/core.ru.js
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public OGame TR snapshots'
            git push origin HEAD:main
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
